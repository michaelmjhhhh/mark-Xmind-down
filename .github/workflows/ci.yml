name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the portable binaries
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/xmind-md
      - name: Test installer on macOS and Linux
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: Test installer on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
      - name: Test installer on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build portable binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          BUILD_VERSION: ${{ inputs.version || github.sha }}
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=$BUILD_VERSION" -o "dist/xmind-md-$GOOS-$GOARCH$suffix" ./cmd/xmind-md
      - uses: actions/upload-artifact@v4
        with:
          name: xmind-md-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
