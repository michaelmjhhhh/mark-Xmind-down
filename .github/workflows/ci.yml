name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/xmind-md

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build portable binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::12}" -o "dist/xmind-md-$GOOS-$GOARCH$suffix" ./cmd/xmind-md
      - uses: actions/upload-artifact@v4
        with:
          name: xmind-md-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
